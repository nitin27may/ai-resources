{% extends "base.html" %}

{% block scripts %}
  {{ super() }}
  <!-- Force dark theme as default; only respect explicit user choice of light -->
  <script>
    (function () {
      var stored = localStorage.getItem("data-md-color-scheme");
      if (stored !== "default") {
        document.body.setAttribute("data-md-color-scheme", "slate");
        document.body.setAttribute("data-md-color-primary", "indigo");
        document.body.setAttribute("data-md-color-accent", "indigo");
        localStorage.setItem("data-md-color-scheme", "slate");
      }
    })();
  </script>
{% endblock %}



{% block footer %}
  {% include "partials/footer.html" %}
{% endblock %}
