site_name: AI Knowledge Hub
site_url: https://nitinksingh.com/ai-resources/
site_description: Your go-to resource for AI knowledge -- from basics to architecture patterns
repo_url: https://github.com/nitin27may/ai-resources
repo_name: AI Knowledge Hub
edit_uri: "?path=/docs/"

# Theme configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.tooltips
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  icon:
    logo: material/book-open-page-variant
  font:
    text: Roboto
    code: Roboto Mono
  custom_dir: overrides

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
      preserve_tabs: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - toc:
      permalink: true
  - attr_list
  - abbr
  - def_list
  - md_in_html
  - pymdownx.details
  - footnotes
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra CSS and JavaScript
extra_css:
  - assets/stylesheets/theme.css
  - assets/stylesheets/fullwidth-toggle.css
  - assets/stylesheets/footer-custom.css

extra_javascript:
  - assets/javascripts/fullwidth-toggle.js

# Plugins configuration
plugins:
  - search
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

nav:
  - Home: index.md
  - Start Here:
      - The Path: 00-start-here/the-path.md
      - Setup: 00-start-here/setup.md
      - AI 101: getting-started/index.md
  - Foundations:
      - How Models Work: concepts/foundation-and-models.md
      - Prompting: concepts/prompting-and-techniques.md
      - Embeddings: rag/embeddings.md
      - Fine-Tuning & Training: concepts/fine-tuning-and-training.md
  - The Agent Path:
      - Tool Calling: 02-agents/tool-calling.md
      - The Agent Loop: 02-agents/the-agent-loop.md
      - The Harness: 02-agents/the-harness.md
      - Context Engineering: 02-agents/context-engineering.md
      - Retrieval: 02-agents/retrieval.md
      - Evaluation: 02-agents/evaluation.md
      - Observability: 02-agents/observability.md
      - Safety: 02-agents/safety.md
      - Production: 02-agents/production.md
  - Retrieval in Depth:
      - rag/index.md
      - RAG Fundamentals: rag/rag-fundamentals.md
      - Chunking Strategies: rag/chunking-strategies.md
      - Vector Databases: rag/vector-databases.md
      - GraphRAG: rag/graphrag.md
      - RAG Evaluation: rag/rag-evaluation.md
  - Wider Context:
      - concepts/index.md
      - AI Agents: concepts/ai-agents.md
      - Agentic AI: concepts/agentic-ai.md
      - Retrieval & Data: concepts/retrieval-and-data.md
      - Safety & Responsible AI: concepts/safety-and-responsible-ai.md
      - Infrastructure & Operations: concepts/infrastructure-and-operations.md
  - Patterns:
      - patterns/index.md
      - Design Patterns: patterns/design-patterns.md
      - Enterprise Patterns: patterns/enterprise-patterns.md
      - Design Principles: patterns/design-principles.md
      - Code Quality Pipeline: patterns/code-quality-pipeline.md
  - Your Tools:
      - ai-dev-tools/index.md
      - GitHub Copilot: ai-dev-tools/github-copilot.md
