site_name: AI Knowledge Hub
site_url: https://nitinksingh.com/ai-resources/
site_description: Your go-to resource for AI knowledge -- from basics to architecture patterns
repo_url: https://github.com/nitin27may/ai-resources
# `owner/repo`, matching the mcp-generator and ms-graph-mcp siblings. This was
# "AI Knowledge Hub", which is the site name -- the header widget then read as a
# second copy of the title rather than as a link to source.
repo_name: nitin27may/ai-resources
# `edit/main/docs/` is the GitHub form. This was `?path=/docs/`, which is the
# Azure DevOps convention carried over from the original internal repo -- on
# github.com it produced a URL that is not an edit link, so the edit and view
# icons on every page went nowhere.
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.tooltips
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  icon:
    logo: material/book-open-page-variant
    # Without this Material falls back to a generic Git mark. Both sibling MkDocs
    # sites set it, so the family rendered inconsistently.
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  custom_dir: overrides

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        # `fence_div_format`, not `fence_code_format`. The code format emits
        # `pre.mermaid`, which Material's own Mermaid integration then claims --
        # and on this site (and on a stock Material site) that integration
        # silently produced empty diagrams. Emitting `div.mermaid` keeps
        # Material's handler out of it; assets/javascripts/mermaid-init.js does
        # the rendering against a pinned version.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
      preserve_tabs: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - toc:
      permalink: true
  - attr_list
  - abbr
  - def_list
  - md_in_html
  - pymdownx.details
  - footnotes
  - tables
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Extra CSS and JavaScript
extra_css:
  - assets/stylesheets/theme.css
  - assets/stylesheets/fullwidth-toggle.css
  - assets/stylesheets/diagram-lightbox.css
  - assets/stylesheets/footer-custom.css

extra_javascript:
  - assets/javascripts/fullwidth-toggle.js
  # Pinned. Material's built-in integration pulls `mermaid@11`, an unpinned
  # major, which is how a silent upstream break reached production unnoticed.
  - https://unpkg.com/mermaid@11.12.0/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js
  # Independent of mermaid-init.js on purpose -- it waits for an <svg> to appear
  # rather than being called by the renderer, so it ports to any Material site.
  - assets/javascripts/diagram-lightbox.js

# Plugins configuration
plugins:
  - search
  # Every page carries one layer tag (Start here, Understand, Build, Go deeper,
  # Tools, Reference) and one to three topic tags. docs/tags.md carries the
  # `material/tags` marker, which is what turns the chips into working links.
  # `tags_file:` is deprecated in Material 9.7, so the marker is the mechanism.
  - tags
  # No page has moved yet. This is enabled so that when one does, its old URL
  # keeps working in the same commit that moves it. Every live URL is listed in
  # planning/sitemap-baseline.txt and CI fails if one stops being served.
  - redirects:
      redirect_maps: {}
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

# Six tabs, ordered as a ramp: find your route, understand the ideas, build one,
# go deeper, look things up. Labels are sentence case.
#
# Nav labels are free to change; file paths are not. Every path below is a live
# URL listed in planning/sitemap-baseline.txt and CI fails if one stops being
# served. Moving a file requires a redirect_maps entry in the same commit.
nav:
  - Home: index.md
  - Start here:
      - 00-start-here/index.md
      - AI 101: getting-started/index.md
      - The build path: 00-start-here/the-path.md
  - Understand:
      - concepts/index.md
      - How models work: concepts/foundation-and-models.md
      - Prompting: concepts/prompting-and-techniques.md
      - Retrieval and data: concepts/retrieval-and-data.md
      - What an agent is: concepts/ai-agents.md
      - Agentic AI: concepts/agentic-ai.md
      - Enterprise AI patterns: patterns/enterprise-patterns.md
      - Safety and responsible AI: concepts/safety-and-responsible-ai.md
      - Fine-tuning and training: concepts/fine-tuning-and-training.md
      - Infrastructure and operations: concepts/infrastructure-and-operations.md
  - Build:
      - 0 Setup: 00-start-here/setup.md
      - 1 Tool calling: 02-agents/tool-calling.md
      - 2 Structured output: 02-agents/structured-output.md
      - 3 The agent loop: 02-agents/the-agent-loop.md
      - 4 The harness: 02-agents/the-harness.md
      - 5 Context engineering: 02-agents/context-engineering.md
      - 6 Memory: 02-agents/memory.md
      - 7 Retrieval: 02-agents/retrieval.md
      - 8 Evaluation: 02-agents/evaluation.md
      - 9 Observability: 02-agents/observability.md
      - 10 Safety: 02-agents/safety.md
      - 11 Production: 02-agents/production.md
      - 12 Multi-agent: 02-agents/multi-agent.md
  - Go deeper:
      - Retrieval in depth:
          - rag/index.md
          - RAG fundamentals: rag/rag-fundamentals.md
          - Embeddings: rag/embeddings.md
          - Chunking strategies: rag/chunking-strategies.md
          - Vector databases: rag/vector-databases.md
          - GraphRAG: rag/graphrag.md
          - RAG evaluation: rag/rag-evaluation.md
      - Architecture patterns:
          - patterns/index.md
          - Design patterns: patterns/design-patterns.md
          - Design principles: patterns/design-principles.md
          - Code quality pipeline: patterns/code-quality-pipeline.md
      - Frameworks and platforms: tools-and-frameworks/index.md
      - Developer tools:
          - ai-dev-tools/index.md
          - GitHub Copilot: ai-dev-tools/github-copilot.md
          - Claude Code: ai-dev-tools/claude-code.md
          - Claude Code skills and agents: ai-dev-tools/claude-code-skills.md
          - Model Context Protocol: ai-dev-tools/mcp.md
  - Reference:
      - Glossary: glossary/index.md
      - Resources: reference/resources.md
      - Official sources: references/index.md
      - Browse by tag: tags.md
      - What's new: whats-new/index.md

# Same Google Analytics property as nitinksingh.com, so hub traffic reports
# alongside the blog rather than in a silo. A GA measurement ID is a public
# identifier -- served in every page's HTML -- so it is not a secret.
#
# NOTE: this block was silently deleted once by a nav rewrite that used the
# copyright comment below as its end boundary. The deploy workflow now asserts
# the tag is present in built output, so that cannot happen quietly again.
extra:
  analytics:
    provider: google
    property: G-5Z8HS51RCP

# Copyright footer text
#
# Identical on all four doc sites by design, so the family reads as one property
# -- keep it byte-identical when editing.
#
# NOTE: this site's sibling doc-site links used to live here and are now gone.
# Unlike the three Jekyll siblings, this repo has no nav_external_links, so it
# currently links out ONLY to the blog (via the name above). The siblings are
# still reachable from each other and from the blog, so nothing is orphaned --
