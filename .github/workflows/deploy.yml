name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The labs are standard library only and their tests stub the transport,
      # so this is quick and fails fast.
      - name: Run labs tests
        run: uv run python -m unittest discover -s labs/tests -v

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build MkDocs site
        run: |
          uv run mkdocs build --strict --verbose --clean

      - name: Assert analytics and social tags are present
        run: |
          set -e
          test -f site/index.html
          grep -q 'G-5Z8HS51RCP' site/index.html \
            || { echo "::error::Google Analytics tag missing from built output"; exit 1; }
          grep -q 'property="og:title"' site/index.html \
            || { echo "::error::Open Graph tags missing from built output"; exit 1; }
          grep -q 'application/ld+json' site/index.html \
            || { echo "::error::JSON-LD missing from built output"; exit 1; }
          echo "analytics, Open Graph and JSON-LD all present"

      - name: Assert no live URL was dropped
        run: planning/scripts/sitemap-guard.sh site

      - name: Check internal links and anchors
        run: uv run python planning/scripts/check-links.py

      - name: Validate page front matter
        run: |
          uv run python planning/scripts/check-frontmatter.py

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5