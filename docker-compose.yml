# `version:` is obsolete in Compose v2 and was removed.
services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-resources-docs
    ports:
      - "${DOCS_PORT:-8000}:8000"
    volumes:
      # Live reload. :ro because nothing in the container should write to the
      # working tree; mkdocs serve builds in memory.
      - .:/docs:ro
    restart: unless-stopped
